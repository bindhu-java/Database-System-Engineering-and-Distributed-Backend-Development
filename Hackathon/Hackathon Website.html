<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogiFlow | Smart Logistics</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6fb;color:#0f172a;display:flex;min-height:100vh}
aside{width:325px;background:#0f1a36;color:#e2e8f0;padding:36px 20px 24px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;overflow:auto}
.logo{display:flex;gap:16px;align-items:center;margin:0 0 40px 15px;color:#fff;font-weight:700;font-size:28px;line-height:1.1}
.logo b{background:#2563eb;width:53px;height:53px;border-radius:12px;display:grid;place-items:center;font-size:28px}
.logo small{display:block;font-size:14px;font-weight:400;color:#9fb0d0;margin-top:4px}
aside h6{margin:22px 18px 8px;font-size:14px;letter-spacing:1.5px;color:#6f84ad;font-weight:600}
aside a{display:flex;align-items:center;gap:20px;padding:17px 18px;border-radius:10px;color:#e8eefc;text-decoration:none;font-size:18px}
aside a u{text-decoration:none;width:14px;text-align:center;font-size:13px;color:#cbd5e1}
aside a.on,aside a:hover{background:#1a2850;color:#fff}
.on-line{margin-top:auto;background:#162548;padding:14px 16px;border-radius:10px;font-size:16px}
.on-line:before{content:"";display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:50%;margin-right:12px}
.adm{display:flex;gap:14px;align-items:center;margin:22px 12px 0;color:#fff;font-weight:700;font-size:17px}
.adm i{width:48px;height:48px;border-radius:50%;background:#eef2ff;color:#2563eb;display:grid;place-items:center;font-style:normal;font-size:20px}
.adm small{display:block;font-weight:400;color:#7d93c0;font-size:14px}
.bell{position:relative;width:48px;height:48px;border-radius:10px;background:#f4f6fb;display:grid;place-items:center;margin-right:12px}
.bell em{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:12px;font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
main{flex:1;min-width:0}
header{background:#fff;padding:20px 40px;border-bottom:1px solid #e5e9f2;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:26px}header p{margin:2px 0 0;color:#64748b;font-size:14px}
.user{display:flex;gap:10px;align-items:center;font-size:14px}.user i{width:40px;height:40px;border-radius:50%;background:#e0e7ff;color:#2563eb;display:grid;place-items:center;font-style:normal;font-weight:700}
.wrap{padding:32px 40px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:14px;padding:26px;margin-bottom:24px}
h2{margin:0 0 4px;font-size:24px}.sub{color:#64748b;margin:0 0 20px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.btn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:14px 22px;font-size:15px;cursor:pointer}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:24px}
.stat{display:flex;gap:14px;align-items:center}.stat i{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:700}
.stat span{font-size:13px;color:#64748b}.stat b{display:block;font-size:30px}
table{width:100%;border-collapse:collapse;font-size:15px}th{background:#f4f6fb;text-align:left;padding:14px;font-size:12px;letter-spacing:.5px;color:#64748b}
td{padding:16px 14px;border-bottom:1px solid #eef1f7}td:first-child{font-weight:700}
.pill{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600}
.p1{background:#ede9fe;color:#6d28d9}.p2{background:#fee2e2;color:#dc2626}.p3{background:#dcfce7;color:#16a34a}.p4{background:#fef3c7;color:#b45309}.p5{background:#dbeafe;color:#1d4ed8}
.hi{color:#dc2626;font-weight:700}.no{color:#16a34a;font-weight:700}
input,select{width:100%;padding:14px;border:1px solid #dbe1ee;border-radius:8px;font-size:15px;margin:6px 0 16px;background:#fff}
.row{display:flex;gap:12px}.row input{margin:0}
.two{display:grid;gap:24px;grid-template-columns:1fr 1fr}
.map{background:#eef2f8;border-radius:12px;min-height:340px;position:relative}
.map span{position:absolute;background:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 2px 8px #0001}
.ok{background:#e8f8ee;color:#15803d;padding:16px;border-radius:8px;margin:14px 0}
.kv{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eef1f7;font-size:17px}
.note{display:flex;gap:16px;align-items:center;padding:20px;border:1px solid #e5e9f2;border-radius:12px;margin-bottom:14px;background:#fff;max-width:1100px}
.note i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;flex-shrink:0}
.note small{display:block;color:#64748b;margin-top:4px}
.bar{height:6px;background:#eef1f7;border-radius:9px;margin:6px 0 18px}.bar div{height:100%;border-radius:9px;background:#2563eb}
.sql{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eef1f7}.sql b{color:#2563eb;font-size:18px}.sql span{color:#64748b;font-size:14px}
.tree{text-align:center}.node{display:inline-block;background:#fff;border:1px solid #e5e9f2;border-radius:12px;padding:20px 28px;margin:8px;min-width:170px}
.node b{display:block}.node small{color:#16a34a}
.abc{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.abc div{background:#f8fafc;padding:18px;border-radius:10px}.abc small{display:block;color:#64748b}
@media(max-width:800px){aside{display:none}.two{grid-template-columns:1fr}.wrap,header{padding:20px}}
</style></head><body>
<aside>
<div class="logo"><b>L</b><div>LogiFlow<small>Smart Logistics</small></div></div>
<h6>MAIN</h6><a href="#dashboard"><u>▣</u>Dashboard</a><a href="#shipments"><u>▤</u>Shipments</a><a href="#tracking"><u>◎</u>Live Tracking</a><a href="#routes"><u>⬧</u>Route Optimization</a>
<h6>OPERATIONS</h6><a href="#notifications"><u>◇</u>Notifications</a><a href="#history"><u>◫</u>Delivery History</a>
<h6>DATABASE</h6><a href="#database"><u>▦</u>Database Analytics</a><a href="#distributed"><u>◈</u>Distributed System</a>
<div class="on-line">System Online</div>
<div class="adm"><i>A</i><div>Administrator<small>Logistics Manager</small></div></div>
</aside>
<main><header><div><h1 id="t"></h1><p>Smart Logistics &amp; Delivery Management</p></div><div class="user"><span class="bell">🔔<em>4</em></span><i>A</i><div><b>Admin</b><br><small style="color:#64748b">Manager</small></div></div></header>
<div class="wrap" id="v"></div></main>
<script>
const S=[["SHP75246","Rahul","bachupally → SR Nagar","Electronics","Picked Up","p1","Normal","Today atleast 1 hour"],
["SHP1005","Vikram Singh","Hyderabad → Chennai","Machinery","Picked Up","p1","Normal","Tomorrow, 10:00 AM"],
["SHP1004","Sneha Rao","Chennai → Bengaluru","Medical Supplies","Delayed","p2","High","Today, 6:40 PM"],
["SHP1003","Arjun Reddy","Mumbai → Pune","Clothing","Delivered","p3","Normal","Delivered"],
["SHP1002","Priya Sharma","Delhi → Hyderabad","Documents","Out for Delivery","p4","Normal","Today, 4:15 PM"],
["SHP1001","Rahul Kumar","Hyderabad → Bengaluru","Electronics","In Transit","p5","High","Today, 2:30 PM"]];
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.join("")}</table>`;
const rows=S.map(s=>`<tr data-q="${s.join(' ').toLowerCase()}"><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td><span class="pill ${s[5]}">${s[4]}</span></td><td class="${s[6]=='High'?'hi':'no'}">${s[6]}</td><td>${s[7]}</td></tr>`);
const note=(c,i,t,d)=>`<div class="note"><i style="background:${c[0]};color:${c[1]}">${i}</i><div><b>${t}</b><small>${d}</small></div></div>`;
const B=["#eef2ff","#2563eb"],R=["#fee2e2","#dc2626"],G=["#dcfce7","#16a34a"],Y=["#fef3c7","#b45309"];
const st=(c,i,l,n)=>`<div class="card stat" style="margin:0"><i style="background:${c[0]};color:${c[1]}">${i}</i><div><span>${l}</span><b>${n}</b></div></div>`;
const P={
dashboard:["Dashboard",()=>`<div class="top"><div><h2>Good morning, Administrator 👋</h2><p class="sub">Here's what's happening with your deliveries today.</p></div><button class="btn" data-go="shipments">+ New Shipment</button></div>
<div class="grid">${st(B,"▤","Total Shipments",6)}${st(Y,"●","In Transit",1)}${st(R,"!","Delayed",1)}${st(G,"✓","Delivered",1)}</div>
<div class="two"><div class="card"><b>Live Delivery Overview</b><p class="sub">Real-time shipment activity</p><div class="map"><span style="left:8%;top:60%">Hyderabad</span><span style="right:30%;top:15%">Chennai</span><span style="right:6%;bottom:8%">Bengaluru</span><span style="left:46%;top:46%">🚚</span></div></div>
<div class="card"><b>Delivery Performance</b><p class="sub">Current distribution</p>Delivered<div class="bar"><div style="width:60%;background:#22c55e"></div></div>In Transit<div class="bar"><div style="width:15%"></div></div>Delayed<div class="bar"><div style="width:5%;background:#ef4444"></div></div></div></div>
<div class="card"><b>Recent Shipments</b><p class="sub">Latest delivery activity</p>${tbl(["TRACKING ID","CUSTOMER","ROUTE","PACKAGE","STATUS","PRIORITY","ETA"],rows)}</div>`],
shipments:["Shipment Management",()=>`<div class="top"><div><h2>All Shipments</h2><p class="sub">Manage and monitor your delivery operations.</p></div><button class="btn" onclick="alert('Static copy: creating shipments needs the Flask backend.')">+ Create Shipment</button></div>
<div class="card"><div class="row" style="margin-bottom:20px"><input id="q" placeholder="Search tracking ID, customer or location..." oninput="f()"></div>${tbl(["TRACKING ID","CUSTOMER","ROUTE","PACKAGE","STATUS","PRIORITY","ETA"],rows)}</div>`],
tracking:["Live Shipment Tracking",()=>`<div class="card" style="max-width:1060px"><h2>Track Your Shipment</h2><p class="sub">Enter your shipment tracking ID to see the latest delivery status.</p><div class="row"><input id="id" placeholder="Example: SHP1001"><button class="btn" onclick="tr()">Track Shipment</button></div><div id="r"></div></div>`],
routes:["Route Optimization",()=>`<div class="two"><div class="card"><h2>Optimize Delivery Route</h2><p class="sub">Find an efficient route to reduce travel time, fuel consumption and delivery delays.</p>Pickup Location<input value="Hyderabad">Destination<input value="Bengaluru">Vehicle<select><option>Truck - TS09AB1234</option></select><button class="btn" style="width:100%">Optimize Route</button><div class="ok">✓ Optimized route available</div><div class="kv">Distance<b>576 km</b></div><div class="kv">Estimated Time<b>8h 20m</b></div><div class="kv">Estimated Fuel Cost<b>₹4,850</b></div></div>
<div class="card"><div class="map" style="min-height:520px"><span style="left:40%;top:8%">Hyderabad</span><div style="position:absolute;left:50%;top:30%;height:45%;width:4px;background:#2563eb"></div><span style="left:47%;top:50%;padding:4px">🚚</span><span style="left:40%;bottom:8%">Bengaluru</span></div></div></div>`],
notifications:["Notifications",()=>`<h2>Notification Center</h2><p class="sub">Important shipment and delivery updates.</p>${note(B,"i","New shipment SHP75246 has been created.","2026-10-07 05:58:50")}${note(R,"!","Shipment SHP1004 has been delayed.","2026-10-07 05:56:41")}${note(G,"✓","Shipment SHP1003 was delivered successfully.","2026-10-07 05:56:41")}${note(Y,"⚠","Shipment SHP1002 is out for delivery.","2026-10-07 05:56:41")}${note(B,"i","Shipment SHP1001 is currently in transit.","2026-10-07 05:56:41")}`],
history:["Delivery History",()=>`<div class="card"><div class="top"><div><h2>Completed Deliveries</h2><p class="sub">Historical record of successfully delivered shipments.</p></div><b>1 Deliveries</b></div>${tbl(["TRACKING ID","CUSTOMER","ROUTE","PACKAGE","STATUS","COMPLETED"],['<tr><td>SHP1003</td><td>Arjun Reddy</td><td>Mumbai → Pune</td><td>Clothing</td><td><span class="pill p3">Delivered</span></td><td>2026-10-07 05:56:41</td></tr>'])}</div>`],
database:["Database & Query Analytics",()=>`<div class="grid">${st(B,"DB","Total Records",6)}${st(G,"✓","Database Status","Online")}${st(Y,"IX","Indexes",3)}${st(R,"!","Delayed Records",1)}</div>
<div class="two"><div class="card"><h2>SQL Operations</h2>${[["SELECT","Retrieve shipment records"],["INSERT","Create new shipments"],["UPDATE","Update shipment status"],["DELETE","Remove obsolete records"],["JOIN","Combine relational data"],["GROUP BY","Aggregate delivery statistics"]].map(x=>`<div class="sql"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>
<div class="card"><h2>Query Performance</h2>Tracking ID Search — 8 ms<div class="bar"><div style="width:90%"></div></div>Customer Search — 12 ms<div class="bar"><div style="width:82%"></div></div>Delivery History — 21 ms<div class="bar"><div style="width:70%"></div></div></div></div>
<div class="card"><h2>Indexing Strategy</h2><div class="abc"><div><b>B-Tree Index</b><small>Fast tracking ID lookup</small></div><div><b>Composite Index</b><small>Optimized route searches</small></div><div><b>Covering Index</b><small>Reduced table access</small></div></div></div>`],
distributed:["Distributed System",()=>`<div class="card"><h2>Distributed Logistics Infrastructure</h2><p class="sub">A scalable architecture designed to support large numbers of users, vehicles and deliveries.</p></div>
<div class="tree"><div class="node"><b>Primary Database</b>Hyderabad<br><small>● Healthy</small></div><br><div class="node"><b>Replica 01</b>Bengaluru<br><small>● Healthy</small></div><div class="node"><b>Replica 02</b>Mumbai<br><small>● Healthy</small></div></div>
<div class="grid" style="margin-top:24px">${st(G,"✓","Replication","Active")}${st(B,"R","Read Scaling","Enabled")}${st(Y,"S","Sharding","Enabled")}</div>
<div class="card"><h2>CAP Theorem</h2><div class="abc"><div><b>Consistency</b><small>All nodes see consistent data.</small></div><div><b>Availability</b><small>Requests continue to receive responses.</small></div><div><b>Partition Tolerance</b><small>System continues despite network partitions.</small></div></div></div>`]};
function f(){const q=document.getElementById("q").value.toLowerCase();document.querySelectorAll("tr[data-q]").forEach(r=>r.style.display=r.dataset.q.includes(q)?"":"none")}
function tr(){const i=document.getElementById("id").value.trim().toUpperCase(),s=S.find(x=>x[0]==i);
document.getElementById("r").innerHTML=s?`<div class="ok" style="background:#eef2ff;color:#1e3a8a"><b>${s[0]}</b> · ${s[2]}<br>Status: <b>${s[4]}</b> · ETA: ${s[7]}</div>`:`<div class="ok" style="background:#fee2e2;color:#b91c1c">No shipment found with that ID.</div>`}
let cur=(location.hash||"#dashboard").slice(1);
function nav(k){cur=k;go();window.scrollTo(0,0)}
function go(){const k=P[cur]?cur:"dashboard",p=P[k]||P.dashboard;document.getElementById("t").textContent=p[0];document.getElementById("v").innerHTML=p[1]();
document.title=p[0]+" | LogiFlow";document.querySelectorAll("aside a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+k))}
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(a){e.preventDefault();nav(a.getAttribute("href").slice(1))}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)nav(b.dataset.go)});
go();
</script></body></html>
